<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>rkperf ops viewer</title>
<style>
  :root{
    --bg:#0f1216; --panel:#11161d; --grid:#232b36; --text:#c9d1d9; --dim:#7d8590;
    --npu:#58a6ff; --cpu:#f0883e; --gpu:#3fb950; --sel:#ffd33d; --hot:#ff7b72;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font:13px/1.45 ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:18px;align-items:baseline;padding:8px 14px;background:var(--panel);
    border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden}
  header b{color:#e6edf3;font-weight:600}
  header .k{color:var(--dim)}
  #status{margin-left:auto;color:var(--dim)}
  #wrap{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%}
  footer{padding:6px 14px;background:var(--panel);border-top:1px solid var(--grid);
    color:var(--dim);white-space:nowrap;overflow:hidden}
  footer b{color:var(--text);font-weight:600}
  #drop{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
    align-items:center;justify-content:center;background:rgba(15,18,22,.94);text-align:center}
  #drop.hide{display:none}
  #drop h2{margin:0;font-size:16px;color:#e6edf3;font-weight:600}
  #drop p{margin:0;color:var(--dim)}
  #drop .btn{margin-top:6px;padding:8px 18px;border:1px solid #30363d;border-radius:6px;
    background:#161b22;color:var(--text);cursor:pointer;font:inherit}
  #drop .btn:hover{border-color:#58a6ff;color:#58a6ff}
  #drop.drag{background:rgba(88,166,255,.10)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span><b>rkperf</b> ops viewer</span>
    <span class="k">1</span><span>帧时间线</span>
    <span class="k">2</span><span>算子明细</span>
    <span class="k">3</span><span>热力图</span>
    <span class="k">4</span><span>排行</span>
    <span id="status"></span>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="drop">
      <h2>拖入 ops_report.txt</h2>
      <p>把 rkperf --op-time 生成的那份报表拖进来，或点击选择文件</p>
      <button class="btn" id="pick">选择文件</button>
    </div>
  </div>
  <footer id="hint"></footer>
</div>
<input type="file" id="file" accept=".txt,.log,text/plain" hidden>
<script>
"use strict";

/* ============================ 解析 ============================ */
/* PARSER-BEGIN */
function parseReport(text) {
  const frames = [];
  let cur = null;
  const frameRe = /^\s*frame\s+(\d+)\s+(\d+)\s+ops\s+elapsed\s+([\d.]+)\s+us\s+rw\s+(\d+)\s*KB/;
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    const m = frameRe.exec(line);
    if (m) {
      if (cur) frames.push(cur);
      cur = { idx: +m[1], ops: +m[2], elapsed: +m[3], rw: +m[4], layers: [] };
      continue;
    }
    if (!cur) continue;
    if (!/^\d/.test(line)) continue;
    const r = parseRow(line);
    if (r) cur.layers.push(r);
  }
  if (cur) frames.push(cur);
  return { frames };
}

function parseRow(line) {
  if (!/^\d/.test(line)) return null;
  const toks = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(line))) toks.push([m.index, m.index + m[0].length]);
  if (toks.length < 9) return null;
  const T = i => line.slice(toks[i][0], toks[i][1]);

  const id = parseInt(T(0), 10) || 0;
  const op = T(1), dtype = T(2), target = T(3);

  let cyc = -1, ddr = 0, npu = 0, tot = 0;
  for (let k = 4; k + 1 < toks.length; k++) {
    const mm = /^(\d+)\/(\d+)\/(\d+)$/.exec(T(k));
    if (mm) { cyc = k; ddr = +mm[1]; npu = +mm[2]; tot = +mm[3]; break; }
  }
  if (cyc < 0) return null;

  const inShape = cyc >= 2 ? T(cyc - 2) : "";
  const outShape = cyc >= 2 ? T(cyc - 1) : "";
  const time = parseFloat(T(cyc + 1)) || 0;

  let k = cyc + 2, mac = "", wl = "", rw = 0;
  if (k < toks.length) {
    const t = T(k);
    if (t.indexOf("%") < 0 && t.indexOf("/") >= 0 && t.indexOf(".") >= 0) { mac = t; k++; }
  }
  if (k < toks.length) {
    const t = T(k);
    if (t.indexOf("%") >= 0) { wl = t; k++; }
  }
  if (k < toks.length && /^\d+$/.test(T(k))) { rw = +T(k); k++; }

  let name = "";
  const c = line.indexOf(":");
  if (c >= 0) {
    let b = c;
    while (b > 0 && /[A-Za-z0-9_]/.test(line[b - 1])) b--;
    name = line.slice(b).trim();
  } else if (k < toks.length) {
    name = line.slice(toks[k][0]).trim();
  }
  return { id, op, dtype, target, inShape, outShape, ddr, npu, tot, time, mac, wl, rw, name };
}
/* PARSER-END */

/* ============================ 数据整理 ============================ */
function analyze(frames) {
  const map = new Map();
  frames.forEach((f, fi) => {
    for (const L of f.layers) {
      let o = map.get(L.op);
      if (!o) {
        o = { name: L.op, calls: 0, total: 0, cpu: 0, npu: 0, gpu: 0,
              perFrame: new Array(frames.length).fill(0), maxFrame: 0 };
        map.set(L.op, o);
      }
      o.calls++;
      o.total += L.time;
      if (L.target === "CPU") o.cpu += L.time;
      else if (L.target === "GPU") o.gpu += L.time;
      else o.npu += L.time;
      o.perFrame[fi] += L.time;
    }
  });
  const ops = [...map.values()].sort((a, b) => b.total - a.total);
  for (const o of ops) {
    let mx = 0;
    for (const v of o.perFrame) if (v > mx) mx = v;
    o.maxFrame = mx;
  }
  return ops;
}

/* ============================ 状态 ============================ */
const S = {
  fileName: "",
  frames: [],
  ops: [],
  view: 1,
  selFrame: 0,
  selLayer: 0,
  layerSort: "time",     // time | id
  selOp: 0,
  f0: 0, f1: 0,          // 可见帧窗口 [f0, f1)
  drag: null,
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const elStatus = document.getElementById("status");
const elHint = document.getElementById("hint");
const elDrop = document.getElementById("drop");
let W = 0, H = 0;

const C = {
  bg: "#0f1216", panel: "#11161d", grid: "#232b36", text: "#c9d1d9", dim: "#7d8590",
  npu: "#58a6ff", cpu: "#f0883e", gpu: "#3fb950", sel: "#ffd33d", hot: "#ff7b72",
  bar: "#1f6feb", bar2: "#388bfd", muted: "#30363d",
};

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
const fmtMs = us => (us / 1000).toFixed(2) + " ms";
const fmtUs = us => (us >= 1000 ? (us / 1000).toFixed(2) + " ms" : us.toFixed(0) + " us");

/* ============================ 画布 ============================ */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  W = Math.max(320, r.width);
  H = Math.max(200, r.height);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function txt(s, x, y, opt) {
  opt = opt || {};
  ctx.fillStyle = opt.color || C.text;
  ctx.font = (opt.font || "12px ui-monospace,Consolas,monospace");
  ctx.textAlign = opt.align || "left";
  ctx.textBaseline = opt.base || "middle";
  ctx.fillText(s, x, y);
}

function box(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, Math.max(0, w), Math.max(0, h));
}

function plotRect(m) {
  return { x: m.l, y: 10, w: Math.max(50, W - m.l - m.r), h: Math.max(50, H - 10 - m.b) };
}

/* ============================ 视图 1：帧时间线 ============================ */
function drawTimeline() {
  const P = plotRect({ l: 66, r: 18, b: 28 });
  const F = S.frames, n = F.length;
  const a = S.f0, b = S.f1;
  let max = 0;
  for (let i = a; i < b; i++) max = Math.max(max, F[i].elapsed);
  max = max || 1;

  // 网格 + Y 轴
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const v = (max * t) / ticks;
    const y = P.y + P.h - (P.h * t) / ticks;
    box(P.x, y, P.w, 1, C.grid);
    txt(fmtMs(v), P.x - 8, y, { align: "right", color: C.dim, font: "11px monospace" });
  }

  const nF = b - a;
  const bw = P.w / nF;
  for (let i = a; i < b; i++) {
    const f = F[i];
    const h = (f.elapsed / max) * P.h;
    const x = P.x + (i - a) * bw;
    const sel = i === S.selFrame;
    box(x + Math.min(1, bw * 0.12), P.y + P.h - h, Math.max(1, bw * 0.76), h,
        sel ? C.sel : C.bar);
    if (sel) {
      ctx.strokeStyle = C.sel;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, P.y + 0.5, Math.max(1, bw - 1), P.h - 1);
    }
  }

  // 中位线
  const vals = F.map(f => f.elapsed).sort((x, y) => x - y);
  const med = vals[Math.floor(vals.length / 2)] || 0;
  const my = P.y + P.h - (med / max) * P.h;
  ctx.setLineDash([4, 4]);
  box(P.x, my, P.w, 1, C.dim);
  ctx.setLineDash([]);
  txt("中位 " + fmtMs(med), P.x + P.w - 4, my - 8, { align: "right", color: C.dim, font: "11px monospace" });

  // X 轴刻度
  const step = Math.max(1, Math.round(nF / 8));
  for (let i = a; i < b; i += step) {
    const x = P.x + (i - a) * bw + bw / 2;
    txt("#" + F[i].idx, x, P.y + P.h + 14, { align: "center", color: C.dim, font: "11px monospace" });
  }

  // 选中帧信息
  const sf = F[S.selFrame];
  if (sf) {
    const s = "#" + sf.idx + "  " + fmtMs(sf.elapsed) + "  (" + sf.ops + " ops, rw " + sf.rw + " KB)";
    txt(s, P.x + 6, P.y + 14, { color: C.sel });
  }
}

/* ============================ 视图 2：选中帧的算子明细 ============================ */
function layerList() {
  const f = S.frames[S.selFrame];
  if (!f) return [];
  const arr = f.layers.slice();
  arr.sort(S.layerSort === "id" ? (x, y) => x.id - y.id : (x, y) => y.time - x.time);
  return arr;
}

function drawLayers() {
  const P = plotRect({ l: 176, r: 96, b: 26 });
  const list = layerList();
  const f = S.frames[S.selFrame];
  if (!f || !list.length) return;

  const show = Math.min(list.length, Math.max(1, Math.floor(P.h / 15)));
  S.selLayer = clamp(S.selLayer, 0, show - 1);
  const max = Math.max(...list.slice(0, show).map(l => l.time), 1);
  const rh = P.h / show;

  for (let i = 0; i < show; i++) {
    const L = list[i];
    const y = P.y + i * rh;
    if (i % 2 === 0) box(P.x, y, P.w + 90, rh, "rgba(255,255,255,.02)");
    const w = (L.time / max) * P.w;
    const col = L.target === "CPU" ? C.cpu : L.target === "GPU" ? C.gpu : C.npu;
    box(P.x, y + rh * 0.18, w, rh * 0.64, i === S.selLayer ? C.sel : col);

    const label = "#" + L.id + " " + L.op;
    txt(label, P.x - 8, y + rh / 2,
        { align: "right", color: i === S.selLayer ? C.sel : C.dim, font: "11px monospace" });
    txt(fmtUs(L.time), P.x + P.w + 8, y + rh / 2,
        { color: i === S.selLayer ? C.sel : C.text, font: "11px monospace" });

    if (rh >= 13 && w > 150) {
      const nm = L.name.length > 44 ? L.name.slice(0, 43) + "…" : L.name;
      txt(nm, P.x + 6, y + rh / 2,
          { color: i === S.selLayer ? "rgba(20,20,20,.85)" : "rgba(255,255,255,.78)",
            font: "11px monospace" });
    }
  }

  txt("帧 #" + f.idx + "  " + f.ops + " 层  合计 " + fmtMs(f.elapsed) +
      "   排序：" + (S.layerSort === "id" ? "ID" : "耗时") +
      (list.length > show ? "   显示前 " + show + " / " + list.length + " 层" : ""),
      P.x - 168, P.y + P.h + 14, { color: C.dim, font: "11px monospace" });
  txt("▲▼ 选择   s 切换排序", P.x + P.w, P.y + P.h + 14,
      { align: "right", color: C.dim, font: "11px monospace" });
}

/* ============================ 视图 3：热力图 ============================ */
function heatColor(t) {
  // 0 -> 深灰, 1 -> 红
  const stops = [[13, 17, 23], [22, 60, 96], [31, 111, 235], [210, 153, 34], [248, 81, 73]];
  const x = clamp(t, 0, 1) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const k = x - i, a = stops[i], b = stops[i + 1];
  const c = a.map((v, j) => Math.round(v + (b[j] - v) * k));
  return "rgb(" + c.join(",") + ")";
}

function drawHeatmap() {
  const P = plotRect({ l: 176, r: 18, b: 30 });
  const ops = S.ops, nF = S.f1 - S.f0;
  if (!ops.length || nF <= 0) return;

  const rows = Math.min(ops.length, Math.max(1, Math.floor(P.h / 18)));
  const rh = P.h / rows;
  const cw = P.w / nF;

  for (let r = 0; r < rows; r++) {
    const o = ops[r];
    // 按行归一化：颜色反映"这个算子在不同帧里的相对快慢"
    let mn = Infinity, mx = 0;
    for (let i = S.f0; i < S.f1; i++) {
      const v = o.perFrame[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    const span = mx - mn;

    for (let i = 0; i < nF; i++) {
      const v = o.perFrame[S.f0 + i];
      const t = span > 0 ? (v - mn) / span : (v > 0 ? 0.45 : 0);
      const x = P.x + i * cw;
      box(x, P.y + r * rh, Math.max(1, cw + 0.4), rh - 1, v > 0 ? heatColor(t) : "#0b0f14");
    }

    const labelY = P.y + r * rh + rh / 2;
    txt(o.name, P.x - 8, rh >= 30 ? labelY - 7 : labelY,
        { align: "right", color: r === S.selOp ? C.sel : C.dim, font: "11px monospace" });
    if (rh >= 30) {
      txt("峰值 " + (mx / 1000).toFixed(2) + " ms", P.x - 8, labelY + 7,
          { align: "right", color: C.muted, font: "10px monospace" });
    }
  }

  // 选中帧的竖线
  if (S.selFrame >= S.f0 && S.selFrame < S.f1) {
    const x = P.x + (S.selFrame - S.f0) * cw;
    ctx.strokeStyle = C.sel; ctx.lineWidth = 1;
    ctx.strokeRect(x - 0.5, P.y, Math.max(2, cw), P.h);
  }
  // 选中算子的横线
  if (S.selOp < rows) {
    ctx.strokeStyle = "rgba(255,211,61,.65)";
    ctx.strokeRect(P.x, P.y + S.selOp * rh, P.w, rh - 1);
  }

  // X 轴
  const step = Math.max(1, Math.round(nF / 12));
  for (let i = 0; i < nF; i += step) {
    txt("#" + S.frames[S.f0 + i].idx, P.x + i * cw + cw / 2, P.y + P.h + 14,
        { align: "center", color: C.dim, font: "11px monospace" });
  }
  txt("颜色按行归一化（每行同一尺度），峰值标在算子名下方", 8, P.y + P.h + 14,
      { color: C.dim, font: "10px monospace" });
}

/* ============================ 视图 4：排行 ============================ */
function drawRank() {
  const P = plotRect({ l: 176, r: 116, b: 26 });
  const ops = S.ops;
  if (!ops.length) return;
  const rows = Math.min(ops.length, Math.max(1, Math.floor(P.h / 20)));
  const rh = P.h / rows;
  const grand = ops.reduce((a, o) => a + o.total, 0) || 1;

  for (let i = 0; i < rows; i++) {
    const o = ops[i];
    const y = P.y + i * rh;
    const w = (o.total / ops[0].total) * P.w;
    const wn = (o.npu / o.total) * w, wc = (o.cpu / o.total) * w, wg = (o.gpu / o.total) * w;
    const sel = i === S.selOp;
    box(P.x, y + rh * 0.2, wn, rh * 0.6, C.npu);
    box(P.x + wn, y + rh * 0.2, wc, rh * 0.6, C.cpu);
    box(P.x + wn + wc, y + rh * 0.2, wg, rh * 0.6, C.gpu);
    if (sel) {
      ctx.strokeStyle = C.sel;
      ctx.lineWidth = 1;
      ctx.strokeRect(P.x + 0.5, y + rh * 0.2 + 0.5, Math.max(1, w - 1), rh * 0.6 - 1);
    }
    txt(o.name, P.x - 8, y + rh / 2,
        { align: "right", color: sel ? C.sel : C.dim, font: "11px monospace" });
    txt((o.total / 1000).toFixed(1) + " ms  " + ((o.total / grand) * 100).toFixed(1) + "%",
        P.x + P.w + 8, y + rh / 2,
        { color: sel ? C.sel : C.text, font: "11px monospace" });
  }
  txt("共 " + S.frames.length + " 帧  蓝=NPU 橙=CPU 绿=GPU", P.x - 168, P.y + P.h + 14,
      { color: C.dim, font: "11px monospace" });
}

/* ============================ 调度 ============================ */
function draw() {
  ctx.clearRect(0, 0, W, H);
  box(0, 0, W, H, C.bg);
  if (!S.frames.length) return;
  if (S.view === 1) drawTimeline();
  else if (S.view === 2) drawLayers();
  else if (S.view === 3) drawHeatmap();
  else drawRank();
  updateChrome();
}

const viewName = { 1: "帧时间线", 2: "算子明细", 3: "热力图", 4: "排行" };

function updateChrome() {
  const f = S.frames[S.selFrame];
  const n = S.frames.length;
  const layers = f ? f.layers.length : 0;
  elStatus.textContent =
    (S.fileName ? S.fileName + "  |  " : "") +
    n + " 帧 × " + layers + " 层  |  视图 " + S.view + " " + viewName[S.view] +
    "  |  窗口 #" + (n ? S.frames[S.f0].idx : 0) + "–#" + (n ? S.frames[S.f1 - 1].idx : 0) +
    "  |  选中 #" + (f ? f.idx : 0) + " " + fmtMs(f ? f.elapsed : 0);
  elHint.innerHTML =
    "<b>1-4</b> 视图  <b>←→</b> 平移  <b>↑↓</b> 选帧/选行  " +
    "<b>+ -</b> 缩放  <b>Home/End</b> 首末  <b>f</b> 全览  <b>s</b> 排序  <b>o</b> 选算子  " +
    "<b>拖入文件</b> 换数据";
}

/* ============================ 键盘 ============================ */
function frameWindowSize() { return S.f1 - S.f0; }

function zoom(factor) {
  const n = S.frames.length;
  const size = frameWindowSize();
  let ns = clamp(Math.round(size / factor), 1, n);
  const c = S.selFrame + 0.5;
  let f0 = Math.round(c - ns / 2);
  f0 = clamp(f0, 0, n - ns);
  S.f0 = f0; S.f1 = f0 + ns;
}

function pan(dir) {
  const n = S.frames.length, size = frameWindowSize();
  const step = Math.max(1, Math.round(size * 0.25));
  const f0 = clamp(S.f0 + dir * step, 0, Math.max(0, n - size));
  S.f0 = f0; S.f1 = f0 + size;
}

function moveSel(dir) {
  const n = S.frames.length;
  S.selFrame = clamp(S.selFrame + dir, 0, n - 1);
  const size = frameWindowSize();
  if (S.selFrame < S.f0) { S.f0 = S.selFrame; S.f1 = S.f0 + size; }
  else if (S.selFrame >= S.f1) { S.f1 = S.selFrame + 1; S.f0 = S.f1 - size; }
}

function fitAll() {
  S.f0 = 0; S.f1 = S.frames.length;
}

window.addEventListener("keydown", e => {
  if (!S.frames.length) return;
  const k = e.key;
  let handled = true;
  switch (k) {
    case "1": case "2": case "3": case "4": S.view = +k; break;
    case "ArrowLeft":  S.view === 2 ? (S.selLayer = Math.max(0, S.selLayer - 1)) : pan(-1); break;
    case "ArrowRight": S.view === 2 ? (S.selLayer++) : pan(1); break;
    case "ArrowUp":
      if (S.view === 3 || S.view === 4) S.selOp = Math.max(0, S.selOp - 1);
      else moveSel(-1);
      break;
    case "ArrowDown":
      if (S.view === 3 || S.view === 4) S.selOp++;
      else moveSel(1);
      break;
    case "+": case "=": zoom(1.6); break;
    case "-": case "_": zoom(1 / 1.6); break;
    case "Home": S.f0 = 0; S.f1 = Math.min(S.frames.length, frameWindowSize()); break;
    case "End": S.f1 = S.frames.length; S.f0 = Math.max(0, S.f1 - frameWindowSize()); break;
    case "f": fitAll(); break;
    case "r": fitAll(); S.selFrame = 0; S.selLayer = 0; S.selOp = 0; S.view = 1; break;
    case "s": S.layerSort = S.layerSort === "time" ? "id" : "time"; break;
    case "o": S.selOp = (S.selOp + 1) % Math.max(1, S.ops.length); break;
    default: handled = false;
  }
  if (handled) { e.preventDefault(); draw(); }
});

/* ============================ 文件加载 ============================ */
function loadText(text, name) {
  const data = parseReport(text);
  if (!data.frames.length) {
    alert("没解析到帧数据 —— 这是 rkperf --op-time 生成的 ops_report.txt 吗？");
    return;
  }
  S.frames = data.frames;
  S.ops = analyze(data.frames);
  S.fileName = name || "";
  S.selFrame = 0; S.selLayer = 0; S.selOp = 0; S.view = 1;
  fitAll();

  // 可选参数：?view=1..4&sel=帧号&zoom=窗口帧数（截图/分享链接用）
  const q = new URLSearchParams(location.search);
  const v = parseInt(q.get("view"), 10);
  if (v >= 1 && v <= 4) S.view = v;
  const sel = parseInt(q.get("sel"), 10);
  if (sel >= 1) S.selFrame = clamp(sel - 1, 0, S.frames.length - 1);
  const z = parseInt(q.get("zoom"), 10);
  if (z > 0 && z < S.frames.length) {
    const f0 = clamp(S.selFrame - Math.floor(z / 2), 0, S.frames.length - z);
    S.f0 = f0; S.f1 = f0 + z;
  }

  elDrop.classList.add("hide");
  draw();
}

document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadText(String(rd.result), f.name);
  rd.readAsText(f, "utf-8");
});

document.getElementById("pick").addEventListener("click", () => document.getElementById("file").click());

["dragenter", "dragover"].forEach(t => window.addEventListener(t, e => {
  e.preventDefault(); elDrop.classList.add("drag");
}));
["dragleave", "drop"].forEach(t => window.addEventListener(t, e => {
  e.preventDefault(); elDrop.classList.remove("drag");
}));
window.addEventListener("drop", e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadText(String(rd.result), f.name);
  rd.readAsText(f, "utf-8");
});

/* 可选：?data=xxx.txt 直接加载（同目录时方便命令行/截图） */
(function autoLoad() {
  const q = new URLSearchParams(location.search).get("data");
  if (!q) return;
  const xhr = new XMLHttpRequest();
  xhr.open("GET", q, true);
  xhr.onload = () => { if (xhr.status === 200 || xhr.status === 0) loadText(xhr.responseText, q.split("/").pop()); };
  try { xhr.send(); } catch (e) { /* file:// 受限时保持拖拽模式 */ }
})();

window.addEventListener("resize", resize);
resize();
</script>
